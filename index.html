<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coleopterium</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Coleopterium</h1>
      <p class="brand-subtitle">The beetle archive</p>
    </header>

    <main>
      <section class="hero">
        <h2>Discover the world of beetles</h2>
        <p>
          Explore species, learn about their lives and build your collection.
        </p>

        <label for="search">Search the encyclopedia</label>
        <div class="search-controls">
          <input
            type="search"
            id="search"
            placeholder="Search by common or scientific name"
          />
          <button type="button">Search</button>
        </div>
      </section>
    </main>
  </body>
</html>
