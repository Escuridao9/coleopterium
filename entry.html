<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stag beetle | Coleopterium</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/entry.js"></script>
  </head>
  <body>
    <header>
      <h1>Coleopterium</h1>
      <p class="brand-subtitle">The beetle archive</p>
    </header>

    <main class="entry-page">
      <a href="index.html">Back to the encyclopedia</a>

      <p id="entry-message" role="status">Loading species information...</p>
      <div id="entry-content" class="entry-layout" hidden>
        <nav class="entry-nav" aria-label="On this page">
          <p>On this page</p>
          <a href="#entry-name">Species</a>
          <a href="#overview-title">Overview</a>
          <a href="#distribution-title">Distribution</a>
          <a href="#size-title">Size comparison</a>
        </nav>

        <article class="entry-details">
          <h2 id="entry-name">Stag beetle</h2>

          <p>
            <i id="entry-scientific-name" lang="la">Lucanus cervus</i>
          </p>

          <dl class="entry-facts">
            <div>
              <dt>Adult length</dt>
              <dd id="entry-length"></dd>
            </div>

            <div>
              <dt>Habitat</dt>
              <dd id="entry-habitat"></dd>
            </div>
          </dl>

          <img
            id="entry-image"
            src="images/stag-beetle.jpg"
            alt="Male stag beetle viewed from above"
          />

          <p class="image-credits">
            Photo: <a id="entry-photo-source"></a> (<a
              id="entry-photo-license"
            ></a
            >).
          </p>

          <section class="entry-section" aria-labelledby="overview-title">
            <h3 id="overview-title">Overview</h3>
            <p id="entry-overview"></p>

            <p class="entry-source">
              Source: <a id="entry-overview-source"></a>
            </p>
          </section>

          <section class="entry-section" aria-labelledby="distribution-title">
            <h3 id="distribution-title">Distribution</h3>
            <p id="entry-distribution"></p>

            <figure id="entry-map" class="distribution-map" hidden>
              <img id="entry-map-image" alt="" loading="lazy" />

              <figcaption>
                <p id="entry-map-caption"></p>
                <p class="entry-source">
                  Map by <a id="entry-map-source"></a> (<a
                    id="entry-map-license"
                  ></a
                  >).
                </p>
              </figcaption>
            </figure>

            <p class="entry-source">
              Source: <a id="entry-distribution-source"></a>
            </p>
          </section>

          <section class="entry-section" aria-labelledby="size-title">
            <h3 id="size-title">Size comparison</h3>

            <figure class="size-comparison">
              <div class="size-comparison-stage" aria-hidden="true">
                <div class="size-comparison-column">
                  <img id="size-beetle-image" alt="" />
                </div>

                <div class="size-comparison-column">
                  <div id="size-coin" class="size-coin"></div>
                </div>
              </div>

              <figcaption>
                <div class="size-comparison-labels">
                  <p>
                    <strong id="size-beetle-name"></strong><br />
                    <span id="size-beetle-length"></span>
                  </p>

                  <p>
                    <strong>€1 coin</strong><br />
                    23.25 mm diameter
                  </p>
                </div>

                <p id="size-description"></p>
                <p>Schematic silhouettes shown at a relative scale.</p>

                <p class="entry-source">
                  Beetle length: <a id="size-source"></a>. Coin dimensions:
                  <a
                    href="https://www.ecb.europa.eu/euro/coins/common/html/index.en.html"
                  >
                    European Central Bank </a
                  >.
                </p>
              </figcaption>
            </figure>
          </section>
        </article>
      </div>
    </main>
  </body>
</html>
