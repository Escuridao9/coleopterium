<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="400" viewBox="0 0 240 400" role="img" aria-labelledby="title desc">
  <title id="title">Titan beetle silhouette</title>
